name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref so a burst of pushes to a PR branch
# does not pile up parallel full-CI runs. Never cancel on main: a cancelled
# deploy could leave a half-shipped release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  # Detect which areas a PR touches so we can skip whole jobs that aren't
  # affected. On a push to main this job still runs, but every downstream job
  # gates on `github.event_name == 'push'` too, so main always runs everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      marketing: ${{ steps.filter.outputs.marketing }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'harness/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'harness/**'
              - '.github/workflows/ci.yml'
            marketing:
              - 'apps/marketing/**'
              - '.github/workflows/ci.yml'

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@17456f8c7d042d8c82c9a8ca9e937231f9f42e26 # v3.95.2
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

      - name: Enforce immutable GitHub Action references
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          invalid = []
          pattern = re.compile(r"^\s*uses:\s*[^#\s]+@([^#\s]+)", re.MULTILINE)
          for workflow in pathlib.Path(".github/workflows").glob("*.yml"):
              for ref in pattern.findall(workflow.read_text()):
                  if not re.fullmatch(r"[0-9a-f]{40}", ref):
                      invalid.append(f"{workflow}: @{ref}")
          if invalid:
              raise SystemExit("Mutable action references:\n" + "\n".join(invalid))
          PY

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.backend == 'true' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      # Keep uv's virtualenv outside backend/ so source-scanning harness tests
      # do not walk dependency files under backend/.venv.
      UV_PROJECT_ENVIRONMENT: ../.venv/backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install WeasyPrint native dependencies (T-USE-07)
        # WeasyPrint requires libcairo, libpango, libgobject. Without these the
        # Phase 14 PDF export service raises OSError at import time and the
        # `test_pdf_export_service.py` suite skips at the module level.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b \
            libffi8 \
            fonts-dejavu

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Generate test JWT keypair
        # Some backend tests exercise real RS256 auth paths. Generate a fresh
        # throwaway keypair in CI so those paths use valid PEM without storing
        # a private key in the repository.
        run: |
          uv run python - <<'PY' >> "$GITHUB_ENV"
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa

          private_key = rsa.generate_private_key(
              public_exponent=65537,
              key_size=2048,
          )
          private_pem = private_key.private_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PrivateFormat.TraditionalOpenSSL,
              encryption_algorithm=serialization.NoEncryption(),
          ).decode("utf-8")
          public_pem = private_key.public_key().public_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PublicFormat.SubjectPublicKeyInfo,
          ).decode("utf-8")

          for name, value in (
              ("JWT_PRIVATE_KEY", private_pem),
              ("JWT_PUBLIC_KEY", public_pem),
          ):
              print(f"{name}<<__SPECFORGE_CI_JWT_KEY__")
              print(value, end="")
              print("__SPECFORGE_CI_JWT_KEY__")
          PY

      - name: Apply database migrations
        run: |
          echo "::group::Reset test database"
          uv run python scripts/reset_test_database.py
          echo "::endgroup::"
          echo "::group::Alembic migrate"
          uv run alembic upgrade head
          echo "::endgroup::"
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      - name: Ruff
        run: uv run ruff check .

      - name: Black
        run: uv run black --check .

      - name: Bandit
        run: uv run bandit -r config.py database.py main.py middleware models prompts routers schemas services

      - name: Python dependency audit
        # No advisories are suppressed: the previously-acknowledged PYSEC-2026-161
        # (starlette < 1.0.1) no longer applies now that starlette is on 1.3.x.
        # Any advisory must fail CI; fix by bumping the affected dependency.
        run: uv run pip-audit --strict

      - name: Pytest
        # These schema-owning integration modules call Alembic reset helpers or
        # Base.metadata.drop_all against TEST_DATABASE_URL. Keep them out of the
        # shared backend suite so one module cannot drop/mutate the schema for
        # later tests in the same pytest process.
        run: >-
          uv run pytest tests/
          --ignore=tests/test_billing_migration_0018.py
          --ignore=tests/test_finalise_integration.py
          --ignore=tests/test_storyboard_service.py
          --ignore=tests/test_storyboard_source_integration.py
          --ignore=tests/test_storyboard_router_integration.py
          --ignore=tests/test_storyboard_public_service.py
          --cov=services
          --cov-fail-under=80
          -q
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          TEST_REDIS_URL: "redis://localhost:6379/0"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      - name: Reset database after full pytest
        run: |
          echo "::group::Reset test database"
          uv run python scripts/reset_test_database.py
          echo "::endgroup::"
          echo "::group::Alembic migrate"
          uv run alembic upgrade head
          echo "::endgroup::"
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      - name: Security harness contracts
        run: >-
          uv run pytest
          ../harness/tests/backend/test_security_audit_contract.py
          ../harness/tests/backend/test_second_pass_security_contract.py
          ../harness/tests/backend/test_final_hardening_contract.py
          ../harness/tests/backend/test_production_readiness_contract.py
          ../harness/tests/backend/test_langfuse_contract.py
          ../harness/tests/backend/test_langfuse_live_traffic_contract.py
          -q
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          TEST_REDIS_URL: "redis://localhost:6379/0"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      - name: Phase 12 provider-agnostic cost harness
        run: uv run pytest ../harness/tests/backend/test_phase12_llm_cost_contract.py -q
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          TEST_REDIS_URL: "redis://localhost:6379/0"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      - name: Phase 12 cost event schema
        run: python3 -m json.tool ../harness/schemas/llm-cost-event.schema.json >/dev/null

      # NOTE: tests/test_github_integration.py, test_github_api_client.py and
      # test_task_parser.py already run inside the main Pytest step above (they
      # are not in its --ignore list, and the empty GITHUB_CLIENT_* they used
      # are the config defaults). The dedicated re-run step was dropped to save
      # CI minutes; re-add a one-module step here only when triaging a failure.

      - name: Phase 13 GitHub integration harness contracts
        run: uv run pytest ../harness/tests/backend/test_phase13_github_integration_contract.py -q
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      - name: Phase 13 integration push schema
        run: python3 -m json.tool ../harness/schemas/integration-push.schema.json >/dev/null

      - name: Phase 14 V1.3 usefulness backend contracts
        run: uv run pytest ../harness/tests/backend/test_phase14_v13_usefulness_contract.py -q
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      # NOTE: the per-feature V1.3 unit modules (test_spec_clarifier,
      # test_pdf_export_service, test_public_share_service,
      # test_online_eval_task_fields, test_seed_templates) already run inside
      # the main Pytest step above. The dedicated re-run step (kept only for
      # per-feature failure attribution) was dropped to save CI minutes.

      - name: Phase 14 public-workspace + template schemas
        run: |
          python3 -m json.tool ../harness/schemas/public-workspace.schema.json >/dev/null
          python3 -m json.tool ../harness/schemas/template.schema.json >/dev/null

      - name: Phase 16 final remediation harness contracts
        run: >-
          uv run pytest
          ../harness/tests/backend/test_phase16_final_remediation_contract.py
          -q
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          TEST_REDIS_URL: "redis://localhost:6379/0"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      # Phase 21 — GitHub Living System of Record (T-265–T-286). The structural
      # contract + the T-285 behavioral suite (the latter runs in the main
      # Pytest step above via tests/test_phase24_behavioral.py).
      - name: Phase 24 GitHub living harness contracts
        run: >-
          uv run pytest
          ../harness/tests/backend/test_phase24_github_living_contract.py
          -q
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          TEST_REDIS_URL: "redis://localhost:6379/0"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

  worker-image:
    name: Worker Image Build
    runs-on: ubuntu-latest
    # The Dockerfile rarely changes and the build is uncached (slow). PRs skip
    # it; main still builds + validates the image before `deploy` consumes it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The durable workers — the bulk lane (`worker: arq worker.WorkerSettings`)
      # and the F5 fast lane (`worker_fast: arq worker.FastWorkerSettings`) — share
      # this backend image (same image, different start command; compose `worker`
      # + `worker-fast`). Building it here proves the worker image is deployable
      # before main is allowed to ship.
      - name: Build backend / worker image
        run: docker build -t specforge-worker:ci ./backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.frontend == 'true' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: frontend_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/frontend_e2e
      REDIS_URL: redis://127.0.0.1:6379/1
      GOOGLE_CLIENT_ID: frontend-e2e-client
      GOOGLE_CLIENT_SECRET: frontend-e2e-secret
      FRONTEND_URL: http://127.0.0.1:4173
      VITE_API_URL: http://127.0.0.1:8000
      E2E_API_URL: http://127.0.0.1:8000
      ANTHROPIC_API_KEY: e2e-disabled-anthropic
      OPENAI_API_KEY: e2e-disabled-openai
      GOOGLE_API_KEY: e2e-disabled-google
      ENCRYPTION_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CSRF_SECRET: frontend-e2e-csrf-secret-long-enough
      ENVIRONMENT: test
      PAYMENTS_ENABLED: "false"
      UV_PROJECT_ENVIRONMENT: ../.venv/backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # pnpm 9/10 use npm's retired audit endpoint and now fail with HTTP
          # 410 before typecheck/tests. pnpm 11 uses the supported bulk API.
          version: 11.13.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Set up uv for OpenAPI drift check
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Docker-backed browser API
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python - <<'PY' >> "$GITHUB_ENV"
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa

          key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          private_pem = key.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.TraditionalOpenSSL,
              serialization.NoEncryption(),
          ).decode()
          public_pem = key.public_key().public_bytes(
              serialization.Encoding.PEM,
              serialization.PublicFormat.SubjectPublicKeyInfo,
          ).decode()
          for name, value in (("JWT_PRIVATE_KEY", private_pem), ("JWT_PUBLIC_KEY", public_pem)):
              print(f"{name}<<__E2E_KEY__")
              print(value, end="")
              print("__E2E_KEY__")
          PY

      - name: Migrate, seed, and start deterministic browser API
        working-directory: backend
        run: |
          uv run alembic upgrade head
          echo "E2E_ACCESS_TOKEN=$(uv run python -m scripts.seed_frontend_e2e)" >> "$GITHUB_ENV"
          nohup uv run python -m scripts.run_frontend_e2e_server > /tmp/specforge-e2e-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/specforge-e2e-api.log
          exit 1

      - name: Audit
        run: pnpm audit --audit-level moderate

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Vitest
        run: pnpm test -- --passWithNoTests

      - name: Coverage ratchet
        run: pnpm test:coverage -- --passWithNoTests

      - name: Complete frontend harness
        run: pnpm test:harness

      - name: OpenAPI contract drift
        run: pnpm check:api

      - name: Phase 13 frontend harness contracts
        run: pnpm vitest run --config vitest.harness.config.ts ../harness/tests/frontend/phase13-github-integration.contract.test.ts

      - name: Phase 14 V1.3 usefulness frontend contracts
        run: pnpm vitest run --config vitest.harness.config.ts ../harness/tests/frontend/phase14-v13-usefulness.contract.test.ts

      # Phase 24 (GitHub living) frontend harness — all blocks are green now that
      # the install (T-287), export-mode (T-288), and increments/ideas (T-289)
      # surfaces have landed. Tracked in docs/PRODUCTION_RELEASE_GATE.md (Phase 21).
      - name: Phase 24 GitHub living frontend harness contracts
        run: pnpm vitest run --config vitest.harness.config.ts ../harness/tests/frontend/phase24-github-living.contract.test.ts

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Browser, mobile, and accessibility gates
        run: E2E_ACCESS_TOKEN= pnpm test:e2e

      - name: Docker-backed authenticated browser journeys
        run: pnpm test:e2e:backend

  marketing:
    name: Marketing
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.marketing == 'true' }}
    defaults:
      run:
        working-directory: apps/marketing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production-dependency audit (F8 — issue #42). Scoped to `--prod` and
      # `--audit-level high` because the marketing zone is `output: "static"`
      # (crawlable HTML, zero runtime JS): its risk is what ships, and dev-only
      # build tooling (Astro/Sanity CLI) carries transitive advisories with no
      # actionable bump, which `--prod` excludes. TruffleHog (the `secrets` job)
      # already scans apps/marketing repo-wide, so this only adds dep coverage.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Astro check
        run: pnpm check

      - name: Build
        # Smoke that the credential-free build (no Sanity creds in CI ⇒ homepage
        # + 5 hubs) compiles; the test suite re-builds fresh in its globalSetup,
        # but a clean build step attributes a compile break vs a test-assertion
        # failure without parsing the vitest log.
        run: pnpm build

      - name: Test (metadata / sitemap / robots / noindex / structured-data / GEO QA)
        # vitest globalSetup runs a fresh `astro build` (Sanity creds stripped),
        # then asserts the SEO/GEO contracts against the emitted dist — the
        # Phase-6 validation suite mapped 1:1 to the Phase-2..5 ACs.
        run: pnpm test

      - name: Install Sanity Studio dependencies
        run: pnpm --dir sanity install --frozen-lockfile

      - name: Audit Sanity Studio dependencies
        run: pnpm --dir sanity audit --audit-level moderate

      - name: Typecheck Sanity Studio
        run: pnpm --dir sanity typecheck

      - name: Build Sanity Studio
        run: pnpm --dir sanity build

  deploy:
    name: Deploy
    needs: [secrets, backend, worker-image, frontend, marketing]
    runs-on: ubuntu-latest
    environment: production
    # Keep production deploys opt-in while the project is still in testing.
    # Set the repository variable PRODUCTION_DEPLOY_ENABLED=true after Railway
    # and Vercel projects/secrets are ready.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    # Map the optional marketing project id to a job-level env var so the
    # marketing deploy step can gate on it: the `secrets` context is NOT
    # available in step `if` conditions, but `env` is.
    env:
      VERCEL_MARKETING_PROJECT_ID: ${{ secrets.VERCEL_MARKETING_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.5.0

      - name: Deploy backend to Railway
        run: railway up ./backend --path-as-root --service backend --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy bulk worker to Railway
        run: railway up ./backend --path-as-root --service worker --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy fast worker to Railway
        run: railway up ./backend --path-as-root --service worker-fast --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy frontend to Vercel
        working-directory: frontend
        run: |
          npm install -g vercel@56.4.1
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }} \
            --yes \
            --scope ${{ secrets.VERCEL_ORG_ID }} \
            --project-id ${{ secrets.VERCEL_PROJECT_ID }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Marketing zone — the primary (apex) Vercel project (issue #18, Phase 7).
      # Separate Vercel project from the SPA, so it uses its own project id
      # (VERCEL_MARKETING_PROJECT_ID). PUBLIC_SITE_URL must be set as a project
      # env var in Vercel (canonical/OG/sitemap base). The step is skipped (not
      # failed) until that secret exists, so enabling production deploys before
      # the marketing project is provisioned does not break the deploy job.
      - name: Deploy marketing to Vercel
        if: ${{ env.VERCEL_MARKETING_PROJECT_ID != '' }}
        working-directory: apps/marketing
        run: |
          npm install -g vercel@56.4.1
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }} \
            --yes \
            --scope ${{ secrets.VERCEL_ORG_ID }} \
            --project-id ${{ secrets.VERCEL_MARKETING_PROJECT_ID }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_MARKETING_PROJECT_ID }}
