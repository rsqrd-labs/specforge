name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@17456f8c7d042d8c82c9a8ca9e937231f9f42e26 # v3.95.2
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff
        run: uv run ruff check .

      - name: Black
        run: uv run black --check .

      - name: Bandit
        run: uv run bandit -r config.py database.py main.py middleware models prompts routers schemas services

      - name: Python dependency audit
        run: uv run pip-audit --strict

      - name: Pytest
        run: uv run pytest tests/ --cov=services --cov-fail-under=80 -q
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_PRIVATE_KEY: "ci-test-private-key"
          JWT_PUBLIC_KEY: "ci-test-public-key"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level moderate

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Vitest
        run: pnpm test -- --passWithNoTests

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy
    needs: [secrets, backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy backend to Railway
        uses: railwayapp/railway-action@v1
        with:
          service: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy frontend to Vercel
        working-directory: frontend
        run: |
          npm install -g vercel
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }} \
            --yes \
            --scope ${{ secrets.VERCEL_ORG_ID }} \
            --project-id ${{ secrets.VERCEL_PROJECT_ID }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
