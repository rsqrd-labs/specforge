name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@17456f8c7d042d8c82c9a8ca9e937231f9f42e26 # v3.95.2
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install WeasyPrint native dependencies (T-USE-07)
        # WeasyPrint requires libcairo, libpango, libgobject. Without these the
        # Phase 14 PDF export service raises OSError at import time and the
        # `test_pdf_export_service.py` suite skips at the module level.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b \
            libffi8 \
            fonts-dejavu

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Apply database migrations
        run: |
          echo "::group::Alembic migrate"
          uv run alembic upgrade head
          echo "::endgroup::"
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_PRIVATE_KEY: "ci-test-private-key"
          JWT_PUBLIC_KEY: "ci-test-public-key"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      - name: Ruff
        run: uv run ruff check .

      - name: Black
        run: uv run black --check .

      - name: Bandit
        run: uv run bandit -r config.py database.py main.py middleware models prompts routers schemas services

      - name: Python dependency audit
        run: uv run pip-audit --strict

      - name: Pytest
        run: uv run pytest tests/ --cov=services --cov-fail-under=80 -q
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          TEST_REDIS_URL: "redis://localhost:6379/0"
          JWT_PRIVATE_KEY: "ci-test-private-key"
          JWT_PUBLIC_KEY: "ci-test-public-key"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      - name: Security harness contracts
        run: >-
          uv run pytest
          ../harness/tests/backend/test_security_audit_contract.py
          ../harness/tests/backend/test_second_pass_security_contract.py
          ../harness/tests/backend/test_final_hardening_contract.py
          ../harness/tests/backend/test_production_readiness_contract.py
          ../harness/tests/backend/test_langfuse_contract.py
          ../harness/tests/backend/test_langfuse_live_traffic_contract.py
          -q
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_PRIVATE_KEY: "ci-test-private-key"
          JWT_PUBLIC_KEY: "ci-test-public-key"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      - name: Phase 12 provider-agnostic cost harness
        run: uv run pytest ../harness/tests/backend/test_phase12_llm_cost_contract.py -q
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_PRIVATE_KEY: "ci-test-private-key"
          JWT_PUBLIC_KEY: "ci-test-public-key"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      - name: Phase 12 cost event schema
        run: python3 -m json.tool ../harness/schemas/llm-cost-event.schema.json >/dev/null

      - name: GitHub integration tests
        run: >-
          uv run pytest
          tests/test_github_integration.py
          tests/test_github_api_client.py
          tests/test_task_parser.py
          -q --no-cov
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_PRIVATE_KEY: "ci-test-private-key"
          JWT_PUBLIC_KEY: "ci-test-public-key"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          GITHUB_CLIENT_ID: ""
          GITHUB_CLIENT_SECRET: ""
          ENVIRONMENT: "test"

      - name: Phase 13 GitHub integration harness contracts
        run: uv run pytest ../harness/tests/backend/test_phase13_github_integration_contract.py -q
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_PRIVATE_KEY: "ci-test-private-key"
          JWT_PUBLIC_KEY: "ci-test-public-key"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      - name: Phase 13 integration push schema
        run: python3 -m json.tool ../harness/schemas/integration-push.schema.json >/dev/null

      - name: Phase 14 V1.3 usefulness backend contracts
        run: uv run pytest ../harness/tests/backend/test_phase14_v13_usefulness_contract.py -q
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_PRIVATE_KEY: "ci-test-private-key"
          JWT_PUBLIC_KEY: "ci-test-public-key"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      - name: Phase 14 V1.3 unit tests
        # Each test module here owns one V1.3 feature. They are also covered
        # by the main pytest run above; this step exists so a failure can be
        # attributed to the right feature without parsing the full log.
        run: >-
          uv run pytest
          tests/test_spec_clarifier.py
          tests/test_pdf_export_service.py
          tests/test_public_share_service.py
          tests/test_online_eval_task_fields.py
          tests/test_seed_templates.py
          -q --no-cov
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_PRIVATE_KEY: "ci-test-private-key"
          JWT_PUBLIC_KEY: "ci-test-public-key"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      - name: Phase 14 public-workspace + template schemas
        run: |
          python3 -m json.tool ../harness/schemas/public-workspace.schema.json >/dev/null
          python3 -m json.tool ../harness/schemas/template.schema.json >/dev/null

      - name: Phase 16 final remediation harness contracts
        run: >-
          uv run pytest
          ../harness/tests/backend/test_phase16_final_remediation_contract.py
          -q
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          TEST_REDIS_URL: "redis://localhost:6379/0"
          JWT_PRIVATE_KEY: "ci-test-private-key"
          JWT_PUBLIC_KEY: "ci-test-public-key"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

      # Phase 21 — GitHub Living System of Record (T-265–T-286). The structural
      # contract + the T-285 behavioral suite (the latter runs in the main
      # Pytest step above via tests/test_phase24_behavioral.py).
      - name: Phase 24 GitHub living harness contracts
        run: >-
          uv run pytest
          ../harness/tests/backend/test_phase24_github_living_contract.py
          -q
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
          TEST_REDIS_URL: "redis://localhost:6379/0"
          JWT_PRIVATE_KEY: "ci-test-private-key"
          JWT_PUBLIC_KEY: "ci-test-public-key"
          GOOGLE_CLIENT_ID: "ci-test-client-id"
          GOOGLE_CLIENT_SECRET: "ci-test-client-secret"
          FRONTEND_URL: "http://localhost:5173"
          ANTHROPIC_API_KEY: "ci-test-anthropic-key"
          OPENAI_API_KEY: "ci-test-openai-key"
          GOOGLE_API_KEY: "ci-test-google-key"
          ENCRYPTION_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CSRF_SECRET: "ci-test-csrf-secret-value-long-enough"
          ENVIRONMENT: "test"

  worker-image:
    name: Worker Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Phase 21 durable worker (Procfile `worker: arq worker.WorkerSettings`,
      # the docker-compose `worker` service) ships the backend image. Building it
      # here proves the worker image is deployable before main is allowed to ship.
      - name: Build backend / worker image
        run: docker build -t specforge-worker:ci ./backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level moderate

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Vitest
        run: pnpm test -- --passWithNoTests

      - name: Phase 13 frontend harness contracts
        run: pnpm vitest run --config vitest.harness.config.ts ../harness/tests/frontend/phase13-github-integration.contract.test.ts

      - name: Phase 14 V1.3 usefulness frontend contracts
        run: pnpm vitest run --config vitest.harness.config.ts ../harness/tests/frontend/phase14-v13-usefulness.contract.test.ts

      # Phase 24 (GitHub living) frontend harness — all blocks are green now that
      # the install (T-287), export-mode (T-288), and increments/ideas (T-289)
      # surfaces have landed. Tracked in docs/PRODUCTION_RELEASE_GATE.md (Phase 21).
      - name: Phase 24 GitHub living frontend harness contracts
        run: pnpm vitest run --config vitest.harness.config.ts ../harness/tests/frontend/phase24-github-living.contract.test.ts

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy
    needs: [secrets, backend, worker-image, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy backend to Railway
        uses: railwayapp/railway-action@v1
        with:
          service: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy frontend to Vercel
        working-directory: frontend
        run: |
          npm install -g vercel
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }} \
            --yes \
            --scope ${{ secrets.VERCEL_ORG_ID }} \
            --project-id ${{ secrets.VERCEL_PROJECT_ID }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
