name: Dependabot alerts to issues

# Automated security fixes (auto-PR on vulnerability detection) are disabled for
# this repo. This workflow is the replacement: it files a GitHub Issue per open
# Dependabot alert instead, so vulnerabilities get triaged without opening a PR.
#
# Requires a repo secret DEPENDABOT_ALERTS_TOKEN: a PAT (classic with the
# security_events scope, or fine-grained with "Dependabot alerts: Read-only" +
# "Issues: Read and write" on this repo). The default GITHUB_TOKEN cannot read
# the Dependabot alerts API.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  file-issues:
    runs-on: ubuntu-latest
    steps:
      - name: File an issue for each open alert without one
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh label create "dependabot-alert" --color "B60205" --description "Filed from a Dependabot security alert" 2>/dev/null || true

          gh api "repos/$REPO/dependabot/alerts?state=open" --paginate --jq '.[] | @base64' | while read -r row; do
            alert=$(echo "$row" | base64 --decode)
            number=$(echo "$alert" | jq -r '.number')
            severity=$(echo "$alert" | jq -r '.security_advisory.severity')
            package=$(echo "$alert" | jq -r '.dependency.package.name')
            ecosystem=$(echo "$alert" | jq -r '.dependency.package.ecosystem')
            manifest=$(echo "$alert" | jq -r '.dependency.manifest_path')
            summary=$(echo "$alert" | jq -r '.security_advisory.summary')
            advisory_url=$(echo "$alert" | jq -r '.security_advisory.references[0].url // ""')
            html_url=$(echo "$alert" | jq -r '.html_url')
            title="Dependabot alert #$number: $package ($severity)"

            existing=$(gh issue list --repo "$REPO" --state all --search "\"$title\" in:title" --json number --jq 'length')
            if [ "$existing" = "0" ]; then
              body_file=$(mktemp)
              {
                printf '**Severity:** %s\n' "$severity"
                printf '**Ecosystem:** %s\n' "$ecosystem"
                printf '**Package:** %s\n' "$package"
                printf '**Manifest:** %s\n\n' "$manifest"
                printf '%s\n\n' "$summary"
                printf '%s\n%s\n' "$advisory_url" "$html_url"
              } > "$body_file"
              gh issue create --repo "$REPO" \
                --title "$title" \
                --label "dependabot-alert" \
                --body-file "$body_file"
              rm -f "$body_file"
            fi
          done
