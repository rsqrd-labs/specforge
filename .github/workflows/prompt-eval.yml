name: prompt-eval

on:
  pull_request:
    paths:
      - "backend/prompts/**"
      - "backend/services/pipeline/prompt_builder.py"
      - "backend/services/pipeline/problem_compressor.py"
      - "backend/services/llm/model_catalog.py"
      - "backend/services/llm/tier_policy.py"
      - "backend/services/llm/output_budget.py"
      - "harness/prompt_eval/**"
      - "docs/evals/golden_prompts/**"
      - ".github/workflows/prompt-eval.yml"

# This workflow makes LIVE, billed provider calls (the eval run below uses the
# real ANTHROPIC/OPENAI/GOOGLE keys), so a superseded run costs money and not
# just Actions minutes. Push three times to a prompt PR and the old two runs
# would otherwise keep buying tokens for a report nobody will read. Cancel them.
# Safe to cancel unconditionally: this is a PR-only advisory report — it ships
# nothing and holds no lock.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  prompt-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check ASDD_PROMPT_VERSION bump
        id: version_check
        run: |
          git fetch origin main --depth=1
          if git diff --quiet origin/main...HEAD -- backend/prompts/; then
            echo "Prompt sources unchanged; evaluation-only change does not require a version bump."
            exit 0
          fi
          OLD=$(git show origin/main:backend/prompts/base.py | grep -oE 'ASDD_PROMPT_VERSION = "asdd-v[0-9.]+"' || true)
          NEW=$(grep -oE 'ASDD_PROMPT_VERSION = "asdd-v[0-9.]+"' backend/prompts/base.py)
          if [ "$OLD" = "$NEW" ]; then
            echo "::error::Prompt files changed but ASDD_PROMPT_VERSION not bumped"
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Same pinned, cache-enabled action the CI workflow uses, rather than a
      # bare `pip install uv` + uncached resolve: this job downloads the whole
      # backend dependency set cold on every run.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --project backend

      - name: Run prompt eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          cd harness
          uv run python -m prompt_eval.run \
            --version "$(grep -oE 'asdd-v[0-9.]+' ../backend/prompts/base.py)" \
            --baseline asdd-v1.8.0 \
            --report ../prompt_eval_report.md

      - name: Comment report on PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v2
        with:
          path: prompt_eval_report.md
