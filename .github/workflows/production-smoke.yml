name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Protected GitHub environment to smoke"
        required: true
        default: staging
        type: environment
      run_llm_smoke:
        description: "Exercise live SPEC -> finalise -> PLAN generation"
        required: true
        default: false
        type: boolean

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run production smoke
        env:
          # Environment-scoped variable: callers choose a protected environment,
          # never an arbitrary token recipient.
          THOUGHT2BUILD_API_URL: ${{ vars.THOUGHT2BUILD_SMOKE_API_URL }}
          THOUGHT2BUILD_ACCESS_TOKEN: ${{ secrets.THOUGHT2BUILD_SMOKE_ACCESS_TOKEN }}
          THOUGHT2BUILD_METRICS_TOKEN: ${{ secrets.THOUGHT2BUILD_METRICS_TOKEN }}
          THOUGHT2BUILD_RUN_LLM_SMOKE: ${{ inputs.run_llm_smoke }}
        run: python3 scripts/production_smoke.py
