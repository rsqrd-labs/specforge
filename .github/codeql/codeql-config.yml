name: "CodeQL config"

# Exclude auto-generated Alembic migrations from analysis.
#
# Each migration module defines the module-level revision identifiers
# (revision / down_revision / branch_labels / depends_on) that Alembic reads via
# reflection at migration time. Nothing in the repo references them statically,
# so CodeQL's py/unused-global-variable flags all four in every migration as
# "defined but not used" — ~4 false positives per migration, forever. They are a
# framework contract and cannot be removed without breaking `alembic upgrade
# head`. Migrations are generated, run-once DDL, so excluding the directory from
# analysis loses no meaningful coverage while killing the recurring noise.
paths-ignore:
  - backend/migrations

# Preserve the existing default-setup coverage: the security-and-quality suite
# includes the maintainability/readability queries that produced every finding
# worked through so far (py/unused-import, py/ineffectual-statement,
# py/import-and-import-from, py/unused-global-variable, ...). Without this the
# migration to advanced setup would silently drop all quality findings.
queries:
  - uses: security-and-quality
