name: Bug report
description: Report a reproducible Thought2Build defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, stop and use the repository Security tab.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal, deterministic steps and sanitized inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, deployment type, and relevant non-secret configuration.
