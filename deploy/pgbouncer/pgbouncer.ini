; PgBouncer transaction-pooling reference config (F3 — scalability audit).
;
; SpecForge is compatible with TRANSACTION-mode pooling because the generation
; pipeline releases its pooled connection during the multi-minute LLM stream
; (audit §1) — no app code relies on session-scoped server state across
; statements. A transaction pooler multiplexes many app connections onto a small
; fixed Postgres server-connection pool, so the Postgres connection count stays
; flat regardless of how many API/worker instances run (the F3 scale-out gate).
;
; Pair this with the app flag DB_TRANSACTION_POOLER_MODE=1, which disables
; asyncpg's prepared-statement cache and gives each prepared statement a unique
; name so statements routed across backend connections never collide.
;
; This file is the documented production reference. The local docker-compose
; `pgbouncer` service (profile: pgbouncer) is configured via the edoburu image's
; environment variables to mirror these settings for end-to-end validation.

[databases]
; One entry per database. `password=` lets PgBouncer authenticate to Postgres
; without a userlist for the server side; client-side auth is `auth_type` below.
specforge = host=db port=5432 dbname=specforge user=specforge password=specforge

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
; Container-writable socket dir (the image's default runtime user can write /tmp).
unix_socket_dir = /tmp

; Client auth. Use scram-sha-256 with a userlist.txt in production; `trust` is
; LOCAL-DEV ONLY (the compose network is bound to 127.0.0.1). Even `trust`
; requires the connecting user to exist in auth_file.
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt

; The whole point: pool per transaction, not per session.
pool_mode = transaction

; Many cheap client connections multiplexed onto a small server pool. Size
; default_pool_size against the confirmed Postgres max_connections (RUNBOOK §15):
; total server connections ≈ default_pool_size × number_of_distinct_(db,user).
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; asyncpg sends these as startup parameters; transaction-mode PgBouncer rejects
; unknown startup params unless they are ignored here. extra_float_digits is
; always sent by asyncpg; statement_timeout / idle_in_transaction_session_timeout
; are the F9 server-side guards the app sets via server_settings — keep them so
; those guards survive the pooler.
ignore_startup_parameters = extra_float_digits,statement_timeout,idle_in_transaction_session_timeout

; Clean each server connection when it is returned to the pool so prepared
; statements (created with unique names by the app in pooler mode) and any
; session state never accumulate. server_reset_query_always=1 forces this to run
; in transaction mode too (it otherwise only runs in session mode).
server_reset_query = DISCARD ALL
server_reset_query_always = 1
