[project]
name = "specforge-backend"
version = "0.1.0"
description = "FastAPI backend for SpecForge V1."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.124.*",
    "starlette==0.50.*",
    "uvicorn[standard]==0.32.*",
    "gunicorn==23.*",
    "sqlalchemy[asyncio]==2.0.*",
    "alembic==1.14.*",
    "asyncpg==0.30.*",
    "supabase==2.*",
    "pydantic==2.*",
    "pydantic-settings==2.*",
    "python-dotenv==1.*",
    "authlib==1.*",
    "python-jose[cryptography]==3.*",
    "passlib==1.*",
    "anthropic==0.40.*",
    "openai==1.57.*",
    "google-genai==1.*",
    "cryptography==46.*",
    "bleach==6.*",
    "stripe==11.*",
    "resend==2.*",
    "redis[asyncio]==5.*",
    "opentelemetry-api==1.*",
    "opentelemetry-sdk==1.*",
    "opentelemetry-instrumentation-fastapi==0.49.*",
    "opentelemetry-instrumentation-sqlalchemy==0.49.*",
    "opentelemetry-exporter-otlp==1.*",
    "prometheus-client==0.21.*",
    "structlog==24.*",
    "sentry-sdk[fastapi]==2.*",
    "httpx==0.28.*",
    "python-multipart==0.0.*",
    "langfuse>=2.60,<3",
]

[dependency-groups]
dev = [
    "bandit==1.*",
    "pip-audit==2.*",
    "safety==3.*",
    "pytest==9.*",
    "pytest-asyncio==1.*",
    "pytest-cov==6.*",
    "black==26.*",
    "ruff==0.8.*",
    "pytest-mock",
]

[tool.uv]
package = false

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
