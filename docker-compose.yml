services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: thought2build
      POSTGRES_USER: thought2build
      POSTGRES_PASSWORD: thought2build
    ports:
      # Long-form syntax binds to 127.0.0.1 only — not exposed to LAN.  L-7 — T-189c.
      - target: 5432
        published: 5432
        host_ip: "127.0.0.1"
        protocol: tcp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thought2build -d thought2build"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Long-form syntax binds to 127.0.0.1 only — not exposed to LAN.  L-7 — T-189c.
      - target: 6379
        published: 6379
        host_ip: "127.0.0.1"
        protocol: tcp
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://thought2build:thought2build@db:5432/thought2build
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:5173
      AUTH_LOGIN_BURST_LIMIT: 60  # Local dev only — do not copy to staging/production
      AUTH_LOGIN_HOURLY_LIMIT: 240  # Local dev only — do not copy to staging/production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Mask the host's .venv (macOS interpreter) so the container keeps its
      # own Linux venv — running uv/pytest on the host otherwise breaks the
      # container's `uv sync` on the next start.
      - api_venv:/app/.venv
    # --timeout-graceful-shutdown caps how long a code-reload waits for
    # in-flight SSE generation streams before force-closing them. Without it a
    # reload during a long generation wedges uvicorn in "Waiting for
    # connections to close" indefinitely — the server accepts no new
    # connections (login breaks) until the generation finishes.
    entrypoint: ["/bin/sh", "-c", "uv sync --frozen --no-dev && uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn main:app --reload --timeout-graceful-shutdown 15 --reload-dir /app/routers --reload-dir /app/services --reload-dir /app/models --reload-dir /app/middleware --reload-dir /app/prompts --reload-dir /app/schemas --reload-dir /app/config --reload-exclude '.venv/*' --reload-exclude 'tests/*' --reload-exclude '.pytest_cache/*' --reload-exclude '.ruff_cache/*' --host 0.0.0.0 --port 8000"]

  worker:
    # Durable background worker — BULK lane (Phase 21 — T-269; F5). Shares the
    # backend image and REDIS_URL/DATABASE_URL with `api`; drains the default
    # queue (GitHub bulk I/O + LLM eval batches) off the request path. No
    # migrations here — `api` owns those.
    build: ./backend
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://thought2build:thought2build@db:5432/thought2build
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Same .venv mask as `api` — see comment there.
      - worker_venv:/app/.venv
    entrypoint: ["/bin/sh", "-c", "uv sync --frozen --no-dev && uv run --no-sync arq worker.WorkerSettings"]

  worker-fast:
    # Durable background worker — FAST lane (F5 — scalability audit). A SEPARATE
    # process draining the fast queue (paid credit grants + PR status checks) so
    # a bulk-export storm on `worker` can never occupy these slots. DEPLOY
    # INVARIANT: this must run in every environment, or paid grants never drain
    # (RUNBOOK §16). Shares the image/env with `worker`; runs no migrations.
    build: ./backend
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://thought2build:thought2build@db:5432/thought2build
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Same .venv mask as `api` — see comment there.
      - worker_venv:/app/.venv
    entrypoint: ["/bin/sh", "-c", "uv sync --frozen --no-dev && uv run --no-sync arq worker.FastWorkerSettings"]

  github-webhook-forwarder:
    # Local-development ingress for a GitHub App whose webhook URL is a Smee
    # channel. GitHub cannot call the loopback-bound API directly, so this
    # supervised process keeps the relay connected and forwards the original
    # signed delivery to the normal HMAC-verifying endpoint. Production should
    # point the App directly at its public HTTPS API and leave the proxy URL
    # empty; the container then stays idle without weakening webhook security.
    build: ./deploy/smee
    env_file:
      - backend/.env
    environment:
      GITHUB_WEBHOOK_TARGET_URL: http://api:8000/integrations/github/webhook
    depends_on:
      - api
    restart: unless-stopped

  pgbouncer:
    # Transaction-mode connection pooler (F3 — scalability audit). Opt-in via the
    # `pgbouncer` profile so the default stack is unchanged:
    #   docker compose --profile pgbouncer up -d pgbouncer
    # then point the app at it and flip the flag:
    #   DATABASE_URL=postgresql+asyncpg://thought2build:thought2build@pgbouncer:6432/thought2build
    #   DB_TRANSACTION_POOLER_MODE=1
    # Env vars mirror deploy/pgbouncer/pgbouncer.ini (the production reference).
    image: edoburu/pgbouncer:v1.23.1-p2
    profiles: ["pgbouncer"]
    # Mount the production-reference ini as-is and run pgbouncer directly,
    # bypassing the image's env-var config generator — so local validation uses
    # the exact config shape documented for production (transaction mode +
    # ignore_startup_parameters + inline server password for SCRAM-to-Postgres).
    entrypoint: ["/usr/bin/pgbouncer"]
    command: ["/etc/pgbouncer/pgbouncer.ini"]
    volumes:
      - ./deploy/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./deploy/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - target: 6432
        published: 6432
        host_ip: "127.0.0.1"
        protocol: tcp
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U thought2build -d thought2build || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      # Long-form syntax binds to 127.0.0.1 only — prevents Vite dev server
      # source maps and HMR websockets from being exposed to LAN.  L-7 — T-189c.
      - target: 5173
        published: 5173
        host_ip: "127.0.0.1"
        protocol: tcp
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_SENTRY_DSN: ""
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"

  langfuse:
    # Pin to a specific version — update deliberately. Check releases:
    # https://github.com/langfuse/langfuse/releases
    # To upgrade: update the tag below, run `docker compose pull langfuse`,
    # smoke-test with `docker compose --profile langfuse up -d`, then commit.
    # MF-5 — T-209.
    image: langfuse/langfuse:3.175.0
    profiles: ["langfuse"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: dev-secret-change-me
      SALT: dev-salt-change-me
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      langfuse-db:
        condition: service_healthy

  langfuse-db:
    image: postgres:16-alpine
    profiles: ["langfuse"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  langfuse_data:
  api_venv:
  worker_venv:
