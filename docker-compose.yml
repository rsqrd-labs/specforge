services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: specforge
      POSTGRES_USER: specforge
      POSTGRES_PASSWORD: specforge
    ports:
      # Long-form syntax binds to 127.0.0.1 only — not exposed to LAN.  L-7 — T-189c.
      - target: 5432
        published: 5432
        host_ip: "127.0.0.1"
        protocol: tcp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specforge -d specforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Long-form syntax binds to 127.0.0.1 only — not exposed to LAN.  L-7 — T-189c.
      - target: 6379
        published: 6379
        host_ip: "127.0.0.1"
        protocol: tcp
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://specforge:specforge@db:5432/specforge
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:5173
      AUTH_LOGIN_BURST_LIMIT: 60  # Local dev only — do not copy to staging/production
      AUTH_LOGIN_HOURLY_LIMIT: 240  # Local dev only — do not copy to staging/production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    entrypoint: ["/bin/sh", "-c", "uv sync --frozen --no-dev && uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn main:app --reload --reload-dir /app/routers --reload-dir /app/services --reload-dir /app/models --reload-dir /app/middleware --reload-dir /app/prompts --reload-dir /app/schemas --reload-dir /app/config --reload-exclude '.venv/*' --reload-exclude 'tests/*' --reload-exclude '.pytest_cache/*' --reload-exclude '.ruff_cache/*' --host 0.0.0.0 --port 8000"]

  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      # Long-form syntax binds to 127.0.0.1 only — prevents Vite dev server
      # source maps and HMR websockets from being exposed to LAN.  L-7 — T-189c.
      - target: 5173
        published: 5173
        host_ip: "127.0.0.1"
        protocol: tcp
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_SENTRY_DSN: ""
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"

  langfuse:
    image: langfuse/langfuse:latest
    profiles: ["langfuse"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: dev-secret-change-me
      SALT: dev-salt-change-me
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      langfuse-db:
        condition: service_healthy

  langfuse-db:
    image: postgres:16-alpine
    profiles: ["langfuse"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  langfuse_data:
